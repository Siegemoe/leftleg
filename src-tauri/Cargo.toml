[package]
name = "leftleg"
version = "0.6.2"
description = "Leftleg — a native control surface for the Pi coding agent"
edition = "2021"
# Oldest compiler that builds the locked graph: quick-xml 0.42 (transitive of
# tauri) requires the edition2024 cargo feature. Verified by the msrv CI job.
rust-version = "1.98.1"

[lib]
name = "leftleg_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "protocol-asset", "tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
