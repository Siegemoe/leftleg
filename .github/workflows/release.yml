name: Windows release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-nightly.*"
  schedule:
    # Nightly from master HEAD (skipped when HEAD already shipped).
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Skip the nightly when master is unchanged since the last one
        id: decide
        if: github.event_name == 'schedule'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # A nightly is only worth shipping when its source moved. The
          # nightly tag created by the previous run points at that run's
          # commit; tauri-action's release-created tags are lightweight, so
          # the ls-remote sha is the commit itself.
          $head = "${{ github.sha }}"
          $nightlies = foreach ($line in (git ls-remote origin "refs/tags/v*-nightly.*")) {
            $parts = $line -split '\s+'
            if ($parts[1] -match '^refs/tags/v(\d+\.\d+\.\d+)-nightly\.(\d+)$') {
              [pscustomobject]@{
                name = $parts[1] -replace '^refs/tags/', ''
                sha = $parts[0]
                base = [version]$Matches[1]
                n = [int]$Matches[2]
              }
            }
          }
          $latest = $nightlies | Sort-Object base, n | Select-Object -Last 1
          if ($latest -and $latest.sha -eq $head) {
            "Nightly skipped: master HEAD $head is already shipped as $($latest.name)" >> $env:GITHUB_STEP_SUMMARY
            "shouldBuild=false" >> $env:GITHUB_OUTPUT
          } else {
            "shouldBuild=true" >> $env:GITHUB_OUTPUT
          }

      - name: Check out the tagged commit
        if: steps.decide.outputs.shouldBuild != 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        if: steps.decide.outputs.shouldBuild != 'false'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Set up Rust
        if: steps.decide.outputs.shouldBuild != 'false'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.98.1"

      - name: Install locked frontend dependencies
        if: steps.decide.outputs.shouldBuild != 'false'
        run: npm ci

      - name: Install pinned Pi integration runtime
        if: steps.decide.outputs.shouldBuild != 'false'
        shell: pwsh
        run: |
          npm install --global @earendil-works/pi-coding-agent@0.85.1
          $piVersion = pi --version
          if ($LASTEXITCODE -ne 0 -or $piVersion.Trim() -ne "0.85.1") {
            throw "Expected Pi 0.85.1 for integration tests; got '$piVersion'"
          }

      - name: Validate tag and version identity
        id: gate
        if: steps.decide.outputs.shouldBuild != 'false'
        shell: pwsh
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          $tauriVersion = (Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json -AsHashtable)['version']
          $packageVersion = (Get-Content -Raw package.json | ConvertFrom-Json -AsHashtable)['version']
          $lockData = Get-Content -Raw package-lock.json | ConvertFrom-Json -AsHashtable
          $lockVersion = $lockData['version']
          $lockPackageVersion = $lockData['packages']['']['version']
          $cargoMetadata = cargo metadata --manifest-path src-tauri/Cargo.toml --no-deps --locked --format-version 1
          if ($LASTEXITCODE -ne 0) {
            throw "cargo metadata failed"
          }
          $cargoVersion = ($cargoMetadata | ConvertFrom-Json).packages |
            Where-Object { $_.name -eq 'leftleg' } |
            Select-Object -ExpandProperty version -First 1

          $versions = @($tauriVersion, $packageVersion, $lockVersion, $lockPackageVersion, $cargoVersion)
          if (($versions | Select-Object -Unique).Count -ne 1) {
            throw "Version mismatch: tauri=$tauriVersion package=$packageVersion lock=$lockVersion lock-package=$lockPackageVersion cargo=$cargoVersion"
          }

          $tag = "${{ github.ref_name }}"
          $isNightly = $false
          if ($env:GITHUB_EVENT_NAME -eq "schedule" -or $env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
            # Nightlies build from the checked-out master HEAD; the release
            # tag is synthesized here (tauri-action creates it) and carries a
            # nightly prerelease segment so semver ordering stays correct
            # (0.7.2-nightly.10 > 0.7.2-nightly.9, and a nightly never
            # satisfies a stable feed). The workflow's run number makes the
            # suffix strictly increasing.
            $isNightly = $true
            $tag = "v$tauriVersion-nightly.$env:GITHUB_RUN_NUMBER"
            if (gh release view "$tag" --json name -q .name 2>$null) {
              throw "Release $tag already exists (re-run of this workflow?). Delete the partial release and tag, then dispatch a fresh run."
            }
          }
          elseif ($tag -match '^v\d+\.\d+\.\d+-nightly\.\d+$') {
            # A manually pushed nightly tag must sit on the checked-in base
            # version; the nightly prerelease segment is the tag's own.
            $isNightly = $true
            $base = $tag -replace '-nightly\.\d+$', ''
            if ($base -ne "v$tauriVersion") {
              throw "Nightly tag $tag must sit on the checked-in version v$tauriVersion"
            }
          }
          elseif ($tag -match '^v\d+\.\d+\.\d+$') {
            if ($tag -ne "v$tauriVersion") {
              throw "Tag $tag does not match application version v$tauriVersion"
            }
          }
          else {
            throw "Release tags must be vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-nightly.N; got '$tag'"
          }

          $isNightlyOut = if ($isNightly) { "true" } else { "false" }
          "isNightly=$isNightlyOut" >> $env:GITHUB_OUTPUT
          $appVersion = if ($isNightly) { $tag.Substring(1) } else { $tauriVersion }
          "appVersion=$appVersion" >> $env:GITHUB_OUTPUT

      - name: Require updater signing secret
        if: steps.decide.outputs.shouldBuild != 'false'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "Repository secret TAURI_SIGNING_PRIVATE_KEY is not configured"
          }

      - name: Verify frontend
        if: steps.decide.outputs.shouldBuild != 'false'
        run: npm run build

      - name: Verify Rust
        if: steps.decide.outputs.shouldBuild != 'false'
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Write the nightly flavor config
        if: steps.gate.outputs.isNightly == 'true'
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.gate.outputs.appVersion }}
        run: |
          $ErrorActionPreference = "Stop"
          # Merged over tauri.conf.json by `tauri build --config`: the nightly
          # carries its full prerelease identity (the updater's semver
          # ordering needs it) and polls the rolling nightly feed instead of
          # the stable one. Stable installs are untouched — their endpoint is
          # latest.json on the newest full release, which never resolves to a
          # prerelease, so a nightly can never hijack the stable feed.
          $overlay = @{
            version = $env:APP_VERSION
            plugins = @{
              updater = @{
                endpoints = @(
                  "https://github.com/Siegemoe/leftleg/releases/download/nightly/latest-nightly.json"
                )
              }
            }
          } | ConvertTo-Json -Depth 5
          Set-Content -Path "${{ github.workspace }}/nightly-tauri.json" -Value $overlay -Encoding utf8NoBOM
          Get-Content "${{ github.workspace }}/nightly-tauri.json"

      - name: Build signed updater and create the release
        if: steps.decide.outputs.shouldBuild != 'false'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Nightly flavors display their full prerelease identity (vite's
          # __APP_VERSION__), matching what their updater feed carries.
          LEFTLEG_BUILD_VERSION: ${{ steps.gate.outputs.appVersion }}
        with:
          tagName: v__VERSION__
          releaseName: Leftleg v__VERSION__${{ steps.gate.outputs.isNightly == 'true' && ' (nightly)' || '' }}
          releaseBody: Signed Windows installer and automatic-update metadata for Leftleg v__VERSION__.${{ steps.gate.outputs.isNightly == 'true' && format(' Built from commit {0}.', github.sha) || '' }}
          # Stable releases stay drafts for inspection before publishing;
          # nightlies publish directly — that is the point of the cadence.
          releaseDraft: ${{ steps.gate.outputs.isNightly == 'true' && 'false' || 'true' }}
          prerelease: ${{ steps.gate.outputs.isNightly == 'true' && 'true' || 'false' }}
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          uploadUpdaterSignatures: true
          # Everything after `--` is forwarded to Cargo by `tauri build`.
          args: ${{ steps.gate.outputs.isNightly == 'true' && format('--config {0}/nightly-tauri.json -- --locked', github.workspace) || '-- --locked' }}

      - name: Publish the rolling nightly feed
        if: steps.gate.outputs.isNightly == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          # The version-tagged prerelease carries its own latest.json, but its
          # URL changes every night — installed nightly flavors poll ONE
          # fixed address. Copy the fresh feed onto the rolling `nightly`
          # release as latest-nightly.json (asset URLs inside point at the
          # version tag, which is where the installers live).
          $tag = "v${{ steps.gate.outputs.appVersion }}"
          gh release download "$tag" --pattern "latest.json" --dir . --clobber
          Move-Item latest.json latest-nightly.json -Force
          if (gh release view nightly --json name -q .name 2>$null) {
            gh release upload nightly latest-nightly.json --clobber
          } else {
            gh release create nightly latest-nightly.json --prerelease `
              --title "Nightly channel" `
              --notes "Rolling automatic-update feed for nightly installs; this file is overwritten every nightly. Installers live on their own vX.Y.Z-nightly.N tags."
          }
