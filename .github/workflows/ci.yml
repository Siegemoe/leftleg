name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Weekly security, coverage, and compatibility re-check.
    - cron: "41 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  RUST_VERSION: "1.98.1"
  PI_VERSION: "0.85.1"

jobs:
  frontend:
    name: Frontend
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    steps:
      - name: Check out the commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check templates and types, run unit tests, and build
        run: npm run build:web

  pi-contract:
    name: Pi contract
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    steps:
      - name: Check out the commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install pinned Pi integration runtime
        shell: pwsh
        run: |
          npm install --global @earendil-works/pi-coding-agent@${{ env.PI_VERSION }}
          $piVersion = pi --version
          if ($LASTEXITCODE -ne 0 -or $piVersion.Trim() -ne "${{ env.PI_VERSION }}") {
            throw "Expected Pi ${{ env.PI_VERSION }} for integration tests; got '$piVersion'"
          }

      - name: Verify the real Pi RPC companion contract
        run: npm run test:integration

  rust-tests:
    name: Rust tests
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    steps:
      - name: Check out the commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri -> target

      - name: Verify Rust behavior
        run: npm run test:rust

  # Keep this single stable check name in the master branch ruleset. The jobs
  # above may be reorganized without requiring a repository-settings change.
  quality-gate:
    name: Required quality gate
    if: always() && github.event_name != 'schedule'
    needs: [frontend, pi-contract, rust-tests]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every functional gate
        shell: bash
        run: |
          failures=0
          check_result() {
            if [ "$2" != "success" ]; then
              echo "::error title=$1 failed::Result was $2"
              failures=1
            fi
          }
          check_result "Frontend" "${{ needs.frontend.result }}"
          check_result "Pi contract" "${{ needs['pi-contract'].result }}"
          check_result "Rust tests" "${{ needs['rust-tests'].result }}"
          exit "$failures"

  # The current repository has known formatting and lint debt. These checks
  # publish the exact remediation queue without blocking functional work.
  # Remove the step-level continue-on-error settings after the baseline cleanup
  # lands, then promote these jobs into the required quality gate.
  frontend-hygiene:
    name: Frontend hygiene (advisory)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check formatting
        id: formatting
        continue-on-error: true
        run: npm run format:check

      - name: Lint TypeScript and Svelte
        id: lint
        if: always()
        continue-on-error: true
        run: npm run lint

      - name: Summarize advisory findings
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.formatting.outcome }}" != "success" ] || [ "${{ steps.lint.outcome }}" != "success" ]; then
            echo "::warning title=Frontend hygiene debt::Prettier or ESLint found baseline issues. See the failed advisory steps for the remediation queue."
            echo "### Frontend hygiene needs cleanup" >> "$GITHUB_STEP_SUMMARY"
            echo "Prettier or ESLint found baseline issues. These findings are visible but do not block functional changes yet." >> "$GITHUB_STEP_SUMMARY"
          fi

  rust-hygiene:
    name: Rust hygiene (advisory)
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    steps:
      - name: Check out the commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri -> target

      - name: Check Rust formatting
        id: formatting
        continue-on-error: true
        run: npm run format:rust:check

      - name: Lint Rust
        id: lint
        if: always()
        continue-on-error: true
        run: npm run lint:rust

      - name: Summarize advisory findings
        if: always()
        shell: pwsh
        run: |
          if ('${{ steps.formatting.outcome }}' -ne 'success' -or '${{ steps.lint.outcome }}' -ne 'success') {
            Write-Output '::warning title=Rust hygiene debt::rustfmt or Clippy found baseline issues. See the failed advisory steps for the remediation queue.'
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '### Rust hygiene needs cleanup'
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value 'rustfmt or Clippy found baseline issues. These findings are visible but do not block functional changes yet.'
          }

  msrv:
    name: Declared Rust 1.77.2 compatibility (advisory)
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    steps:
      - name: Check out the commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up declared minimum Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: "1.77.2"

      - name: Verify the declared minimum compiler
        id: compatibility
        continue-on-error: true
        shell: pwsh
        run: |
          $version = rustc +1.77.2 --version
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^rustc 1\.77\.2 ') {
            throw "Expected Rust 1.77.2; got '$version'"
          }
          cargo +1.77.2 check --manifest-path src-tauri/Cargo.toml --locked

      - name: Summarize advisory finding
        if: always() && steps.compatibility.outcome != 'success'
        shell: pwsh
        run: |
          Write-Output '::warning title=Declared Rust minimum is not supported::The locked dependency graph or source does not compile with Rust 1.77.2.'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '### Declared Rust minimum needs a decision'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value 'Rust 1.77.2 is declared in Cargo.toml but the locked project does not compile with it. Restore compatibility or update the declaration to the oldest compiler the project tests.'

  coverage:
    name: Coverage report (advisory)
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/master'
    runs-on: windows-latest
    steps:
      - name: Check out the commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install pinned Pi integration runtime
        shell: pwsh
        run: npm install --global @earendil-works/pi-coding-agent@${{ env.PI_VERSION }}

      - name: Generate coverage without enforcing an arbitrary threshold
        id: report
        continue-on-error: true
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: frontend-coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

      - name: Summarize coverage failure
        if: always() && steps.report.outcome != 'success'
        shell: pwsh
        run: |
          Write-Output '::warning title=Coverage report failed::Coverage is advisory, but its generation should be repaired.'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '### Coverage report generation failed'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value 'Coverage is advisory, but this reporting failure should be repaired.'

  security:
    name: Dependency audit
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Audit Rust dependencies
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --file src-tauri/Cargo.lock
