version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: America/New_York
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    # @types/node majors track Node runtime release lines and would reopen a
    # PR weekly; the ambient typings only need to match the Node CI builds
    # with (see env.NODE_VERSION in ci.yml). Bump majors deliberately instead.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 is gated, not ready: svelte-check 4.7.6 hard-rejects TS 7
      # as the sole compiler (its supported path is a dual tsgo-preview
      # install with --tsgo). Bump majors deliberately once svelte-check
      # ships drop-in TS 7 support.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: deps(npm)

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: America/New_York
    open-pull-requests-limit: 5
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: deps(cargo)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:45"
      timezone: America/New_York
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: deps(actions)
